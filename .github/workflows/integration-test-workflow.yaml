name: Integration Test Workflow

# NOTE: concurrency is declared on the test-suites job below, NOT at the
# workflow level. Workflow-level concurrency in a called (reusable) workflow
# cancels the ENTIRE caller run, so a newer deployment-test invocation would
# also kill unrelated sibling jobs in the caller (e.g. the local platform
# suite). Job-level groups only ever cancel their own superseded jobs.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read # access to check out code and install dependencies for python (wasmopticon tests)
  actions: read
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      registry:
        description: "Which registry to target, which also chooses which environment to test"
        required: false
        default: wasmer.wtf
        type: choice
        options: [wasmer.wtf, wasmer.fun, wasmer.io]
      test_branch:
        description: "Checkout a specific branch of the integration tests"
        required: false
        default: "main"
        type: string
      fetch_artifact:
        description: "Set to the name of the wasmer artifact you'd like to fetch and use in the integration tests."
        required: false
        default: ""
        type: string
      provide_quality_assessment:
        description: "Classify results against known-issues and print them in the job summary"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      fetch_artifact:
        required: false
        type: string
        description: "Set to the name of the wasmer artifact you'd like to fetch and use in the integration tests."
      test_branch:
        required: false
        type: string
        description: "Checkout a specific branch of the integration tests"
        default: "main"
      registry:
        required: false
        type: string
        description: Which registry to target, which also choses which environment to test
        default: wasmer.wtf
      provide_quality_assessment:
        required: false
        type: boolean
        description: Set to true if you'd like to print integration test results in test_failure_webhook
      release_url:
        required: false
        type: string
        description: "Optional URL of the release that triggered these tests"
    secrets:
      token:
        required: true
        description: "Token used to authenticate towards the wasmer backend"
      test_failure_webhook:
        required: false
        description: "Add optional webhook which will be called if any tests have failed"

jobs:
  test-suite-matrix:
    name: Load integration test suite matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.suites.outputs.matrix }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          repository: wasmerio/wasmer-integration-tests
          ref: ${{ inputs.test_branch }}

      - name: Read shared test suite manifest
        id: suites
        shell: bash
        run: |
          set -euo pipefail
          # platform: false entries (ass unit tests) run in Code QA, not here.
          matrix="$(jq -c '{include: map(select(.platform != false))}' .github/integration-test-suites.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test-suites:
    name: Run ${{ matrix.display_id || matrix.id }} tests
    needs: test-suite-matrix
    runs-on: ubuntu-24.04
    # Default raised from 15: template remote builds alone can consume most
    # of that budget against the dev environment.
    timeout-minutes: ${{ matrix.timeout_minutes || 45 }}
    # Unique per ref + registry + suite: a superseding deployment test for the
    # same ref/registry replaces only the matching suite job, nothing else.
    concurrency:
      group: integration-tests-${{ github.ref }}-${{ inputs.registry }}-${{ matrix.id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.test-suite-matrix.outputs.matrix) }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          repository: wasmerio/wasmer-integration-tests
          ref: ${{ inputs.test_branch }}
          submodules: true
      # The relative path works here as we're checking out the wasmer-integration-tests repo
      - uses: ./.github/actions/setup-test-env
        with:
          fetch_artifact: ${{ inputs.fetch_artifact }}
      - name: Set up Python
        if: ${{ matrix.requires_python == true }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install uv
        if: ${{ matrix.requires_python == true }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python_version }}
          enable-cache: false
      - name: Setup and activate virtual environment
        if: ${{ matrix.requires_python == true }}
        run: |
          python -m venv .venv
          source .venv/bin/activate
      - name: Test
        env:
          WASMER_REGISTRY: https://registry.${{ inputs.registry }}/graphql
          # Callers pass `token`; a manual workflow_dispatch has no way to
          # supply secrets, so fall back to the env's own CI-user secret.
          WASMER_TOKEN: ${{ secrets.token
            || (inputs.registry == 'wasmer.io' && secrets.PROD_BACKEND_CIUSER_TOKEN)
            || (inputs.registry == 'wasmer.fun' && secrets.BUGT_BACKEND_CIUSER_TOKEN)
            || secrets.DEV_BACKEND_CIUSER_TOKEN }}
        # Brace group so multi-line test_command values pipe every command's
        # output; pipefail keeps the jest exit code through tee.
        run: |
          set -euo pipefail
          {
            ${{ matrix.test_command }}
          } 2>&1 | tee jest-output.log
      # Full run info for debugging + the machine summary Barmin aggregates.
      # Registry in the name: per-environment callers would otherwise collide.
      - name: Upload test run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-run-${{ inputs.registry }}-${{ matrix.id }}
          retention-days: 14
          if-no-files-found: warn
          # The summary/registry files are dotfiles; upload-artifact@v4
          # silently drops hidden files unless this is set.
          include-hidden-files: true
          path: |
            jest-output.log
            .jest-run-summary.jsonl
            .jest-deployed-apps.jsonl

  provide-quality-assessment:
    name: Provide quality assessment
    if: ${{ inputs.provide_quality_assessment == true }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          repository: wasmerio/wasmer-integration-tests
          ref: ${{ inputs.test_branch }}
      - name: Add pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install
      - name: Wait for sibling test jobs
        uses: actions/github-script@v8
        with:
          script: |
            const selfNames = new Set([
              'Provide quality assessment', 'provide-quality-assessment',
              context.job, process.env.GITHUB_JOB,
            ]);
            // Reusable-workflow jobs are named "<caller job> / <name>";
            // wait only for our own caller's jobs, found via our runner.
            const bare = name => name.split(' / ').pop();
            const callerOf = name =>
              name.includes(' / ') ? name.slice(0, name.lastIndexOf(' / ')) : '';
            let caller = null;
            // 600 * 5s = 50 minutes — must outlast the 45-minute suite
            // timeout, or Barmin reports a run its slowest suite is
            // still writing.
            for (let i = 0; i < 600; i++) {
              const res = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: context.runId, per_page: 100,
              });
              const jobs = res.data.jobs || [];
              if (caller === null) {
                const self = jobs.find(
                  j => selfNames.has(bare(j.name)) && j.runner_name === process.env.RUNNER_NAME
                );
                caller = self ? callerOf(self.name) : '';
                core.info(`Waiting for sibling jobs of caller "${caller || '<root>'}"`);
              }
              const others = jobs.filter(
                j => !selfNames.has(bare(j.name)) && callerOf(j.name) === caller
              );
              if (others.every(j => j.status === 'completed')) return;
              await new Promise(r => setTimeout(r, 5000));
            }
            core.warning('Sibling jobs still running after 50 minutes');
      - name: Download test run artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-run-${{ inputs.registry }}-*
          path: test-runs
      # All assessment logic (classification against known issues, message
      # composition, Slack posting, job summary) lives in scripts/barmin.ts.
      - name: Compose and post quality assessment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.test_failure_webhook }}
          TESTED_REGISTRY: ${{ inputs.registry }}
          RELEASE_URL: ${{ inputs.release_url || github.event.release.html_url || '' }}
        run: pnpm barmin
