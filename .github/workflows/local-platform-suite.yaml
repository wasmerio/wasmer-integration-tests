name: Local Platform Suite

on:
  workflow_call:
    inputs:
      backend_version:
        type: string
        required: true
        description: "Backend image selector (artifact:<repo>:<run_id>:<name>, resolve_dev, github-release:*, github-artifact:*)."
      edge_version:
        type: string
        required: false
        default: resolve_dev
        description: "Edge binary selector. Defaults to the latest dev release."
      test_branch:
        type: string
        required: false
        default: main
        description: "Branch of wasmerio/wasmer-integration-tests to run the suite from."
      edge_engine:
        type: string
        required: false
        default: wasmer_cranelift
        description: "Edge default engine for the local platform."
      edge_llvm_packages:
        type: string
        required: false
        default: python/python
        description: "Packages routed to a filtered LLVM engine (production's engine) on top of the default."
      runner:
        type: string
        required: false
        default: depot-ubuntu-24.04-16
        description: "Runner label for the suite jobs. Callers without depot must override (e.g. ubuntu-24.04)."
    secrets:
      github_app_client_id:
        required: true
        description: "GitHub App Client ID."
      github_app_private_key:
        required: true
        description: "GitHub App PEM private key."

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read
  packages: read
  pull-requests: read

jobs:
  test-suite-matrix:
    name: Load integration test suite matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.suites.outputs.matrix }}
    steps:
      - name: Clone integration tests
        uses: actions/checkout@v4
        with:
          repository: wasmerio/wasmer-integration-tests
          ref: ${{ inputs.test_branch }}

      - name: Read shared test suite manifest
        id: suites
        shell: bash
        run: |
          set -euo pipefail
          # platform: false entries (ass unit tests) run in Code QA, not here.
          matrix="$(jq -c '{include: map(select(.platform != false))}' .github/integration-test-suites.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  local-platform-cache:
    name: Prepare local platform test environment cache
    # Local reference: resolves to the same repo+ref as this suite file, so a
    # PR branch of this repo exercises its own workflow changes while external
    # callers (which pin this suite @main) keep getting main.
    uses: ./.github/workflows/local-platform-test.yaml
    with:
      backend_version: ${{ inputs.backend_version }}
      edge_version: ${{ inputs.edge_version }}
      test_branch: ${{ inputs.test_branch }}
      edge_engine: ${{ inputs.edge_engine }}
      edge_llvm_packages: ${{ inputs.edge_llvm_packages }}
      prepare_only: true
      suite_id: cache-warmup
      job_name: Prepare local platform test environment cache
      # The LLVM-routed packages (~5 min each) are precompiled here on a cold
      # cache; the rest stays on cranelift.
      timeout_minutes: 60
      runner: ${{ inputs.runner }}
    secrets:
      github_app_client_id: ${{ secrets.github_app_client_id }}
      github_app_private_key: ${{ secrets.github_app_private_key }}

  tests:
    name: Local platform integration test / ${{ matrix.display_id || matrix.id }}
    needs:
      - test-suite-matrix
      - local-platform-cache
    # Local reference: resolves to the same repo+ref as this suite file, so a
    # PR branch of this repo exercises its own workflow changes while external
    # callers (which pin this suite @main) keep getting main.
    uses: ./.github/workflows/local-platform-test.yaml
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.test-suite-matrix.outputs.matrix) }}
    with:
      backend_version: ${{ inputs.backend_version }}
      edge_version: ${{ inputs.edge_version }}
      test_branch: ${{ inputs.test_branch }}
      edge_engine: ${{ inputs.edge_engine }}
      edge_llvm_packages: ${{ inputs.edge_llvm_packages }}
      test_command: ${{ matrix.test_command }}
      suite_id: ${{ matrix.id }}
      job_name: Run ${{ matrix.display_id || matrix.id }} tests
      timeout_minutes: ${{ matrix.timeout_minutes || 45 }}
      runner: ${{ inputs.runner }}
    secrets:
      github_app_client_id: ${{ secrets.github_app_client_id }}
      github_app_private_key: ${{ secrets.github_app_private_key }}
