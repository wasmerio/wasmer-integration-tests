[meta]
id = "WAX-600"
title = "Edge wasix 759ca9d cross-Store panic under CPU starvation"
lifecycle = { state = "open" }

[meta.links]
linear = "https://linear.app/wasmer/issue/WAX-600"
notes = "hivemind knowledge/04-codebases/edge/2026-07-16-wasix-759ca9d-cross-store-panic.md"

[fixtures.components]
# The exact failing releases from the original CI run (script defaults).
edge = "github-release:wasmerio/edge:v2026-07-16_1_fcdd9c4_dev1:edge"
backend = "github-release:wasmerio/backend:v2026-07-15_2_9a6c3d4:*image*.tar*"

[fixtures.perturbations]
# CPU starvation is the trigger; cold caches make instances start like CI.
edge = { cpus = 1, wipe_caches = ["compiler_cache", "webc_cache"] }

[load]
executor = "jest"

[load.jest]
spec = "tests/app/templates.test.ts"
testNamePattern = "next-react-server-components"

[[verdict.reproduced_when.any]]
[verdict.reproduced_when.any.log_matches]
stream = "edge"
pattern = "object used with the wrong context"

[verdict.baseline]
waived = "The failure is an Edge platform panic while serving a remote-built template app under CPU starvation; the workload has no native-engine counterpart to diff against (D10)."

[[verdict.collect]]
[verdict.collect.edge_panic_context]
stream = "edge"
pattern = "panicked at"
before = 1
after = 4
