[meta]
id = "WAX-603"
title = "WASIX timed waits on threading primitives never expire"
lifecycle = { state = "open" }

[meta.links]
linear = "https://linear.app/wasmer/issue/WAX-603"

[fixtures.probes.matrix]
# repro.py + wasmer.toml. {{ matrix.path }} always resolves; the .url
# affordance (deploying the probe as an app) lands in Phase 5.
source = "package:./probe"
# The probe is a wasmer package and an HTTP server, and nothing else.
executors = ["raw-wasmer", "artillery-http"]

[fixtures.components]
# The interpreter under test. Verify a fix without touching this file:
#   pnpm ass run wax-603 --component python=path:/path/to/your/build
python = "registry:python/python@=3.13.5"

[load]
executor = "raw-wasmer"

[load.raw-wasmer]
package = "{{ component.python }}"
args = ["/work/repro.py", "--once"]
# Backstop only: the matrix guards its own hangs with wall-clock watchdogs
# built from primitives that do work, and completes in ~25s even when
# everything is broken. If this fires, the run is inconclusive.
timeoutSeconds = 180

[load.raw-wasmer.volumes]
"{{ matrix.path }}" = "/work"

# Reaches the probe over Edge (the script's MODE=dev1/MODE=prod): the
# harness deploys {{ matrix.url }} on the remote target and tears it down.
#   pnpm ass run wax-603 --env dev --executor artillery-http
[load.artillery-http]
target = "{{ matrix.url }}"
phases = [{ duration = 10, arrivalRate = 1 }]
# Each request runs the whole matrix server-side (~25s when everything
# is broken), so the per-request timeout must outlive it.
http = { timeout = 90 }
scenarios = [{ flow = [{ get = { url = "/" } }] }]

[verdict.probe]
channels = [
  { type = "log", stream = "stderr" }, # local wasmer run / native baseline
  { type = "http", match = "body" },   # deployed-probe runs on Edge
]

[verdict.baseline]
# The whole claim: the same matrix on the host interpreter passes. Without
# it "python hangs" is not yet "WASIX hangs".
engine = "python3"
entry = ["repro.py", "--once"]
workdir = "{{ matrix.path }}"
expect = "not-reproduced"
