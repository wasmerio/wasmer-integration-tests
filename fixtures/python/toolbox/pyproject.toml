[project]
name = "wasmer-integ-tests-shipit-toolbox"
version = "0.1.0"
description = "Toolbox with all kinds of juicy python tests exposed as endpoints"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "hypercorn>=0.17.3",
    "uvicorn>=0.35.0",
    "pg8000>=1.31.2",
    "pymysql>=1.1.1",
    # /results also connects over SQLAlchemy's asyncio layer, which runs the
    # DBAPI inside a greenlet: the only fixture path loading that wheel.
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    "asyncpg>=0.30.0",
]
